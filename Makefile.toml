# cargo-make task runner for the PatentMine Go project.
# Run tasks with: cargo make <task>

[config]
# Skip cargo-make's built-in Rust-oriented tasks; this is a Go project.
skip_core_tasks = true
default_to_workspace = false

[env]
BINARY = "./cmd/patentmine"

[tasks.build]
description = "Compile all packages."
script = '''
describe="$(git describe --always --dirty --tags 2>/dev/null || git rev-parse --short HEAD)"
commit="$(git rev-parse --short HEAD)"
branch="$(git rev-parse --abbrev-ref HEAD)"
ldflags="-X patentmine/internal/version.Describe=$describe -X patentmine/internal/version.Commit=$commit -X patentmine/internal/version.Branch=$branch"
go build -ldflags "$ldflags" ./...
'''

[tasks.fmt]
description = "Format all Go source."
command = "gofmt"
args = ["-w", "."]

[tasks.fmt-check]
description = "Fail if any Go source is unformatted."
script = '''
unformatted="$(gofmt -l .)"
if [ -n "$unformatted" ]; then
  echo "unformatted files:"
  echo "$unformatted"
  exit 1
fi
'''

[tasks.vet]
description = "Run go vet."
command = "go"
args = ["vet", "./..."]

[tasks.lint]
description = "Run golangci-lint."
command = "golangci-lint"
args = ["run"]

[tasks.test]
description = "Run all unit tests."
command = "go"
args = ["test", "./..."]

[tasks.run-daemon]
description = "Start the engine daemon in the foreground."
script = '''
describe="$(git describe --always --dirty --tags 2>/dev/null || git rev-parse --short HEAD)"
commit="$(git rev-parse --short HEAD)"
branch="$(git rev-parse --abbrev-ref HEAD)"
ldflags="-X patentmine/internal/version.Describe=$describe -X patentmine/internal/version.Commit=$commit -X patentmine/internal/version.Branch=$branch"
go run -ldflags "$ldflags" ${BINARY} serve
'''

[tasks.stop-daemon]
description = "Stop the engine daemon if it is running."
script = '''
describe="$(git describe --always --dirty --tags 2>/dev/null || git rev-parse --short HEAD)"
commit="$(git rev-parse --short HEAD)"
branch="$(git rev-parse --abbrev-ref HEAD)"
ldflags="-X patentmine/internal/version.Describe=$describe -X patentmine/internal/version.Commit=$commit -X patentmine/internal/version.Branch=$branch"
go run -ldflags "$ldflags" ${BINARY} stop
'''

[tasks.start-daemon]
description = "Start the engine daemon in the background."
script = '''
describe="$(git describe --always --dirty --tags 2>/dev/null || git rev-parse --short HEAD)"
commit="$(git rev-parse --short HEAD)"
branch="$(git rev-parse --abbrev-ref HEAD)"
ldflags="-X patentmine/internal/version.Describe=$describe -X patentmine/internal/version.Commit=$commit -X patentmine/internal/version.Branch=$branch"
paths="$(go run -ldflags "$ldflags" ${BINARY} paths)"
socket="$(echo "$paths" | awk -F= '/^SOCKET=/{print $2}')"
logs_dir="$(echo "$paths" | awk -F= '/^LOGS=/{print $2}')"
date_tag="$(date +%F)"
stdout_log="$logs_dir/daemon-stdout-$date_tag.log"
nohup go run -ldflags "$ldflags" ${BINARY} serve >> "$stdout_log" 2>&1 &
for _ in $(seq 1 50); do
  if [ -S "$socket" ]; then
    echo "patentmine daemon started ($socket)"
    echo "stdout log: $stdout_log"
    echo "structured log: $logs_dir/log-$date_tag.jsonl"
    echo "activity log: $logs_dir/activity-$date_tag.jsonl"
    exit 0
  fi
  sleep 0.1
done
echo "patentmine daemon did not create socket: $socket"
echo "check stdout log: $stdout_log"
exit 1
'''

[tasks.restart-daemon]
description = "Restart the engine daemon in the background."
dependencies = ["stop-daemon", "start-daemon"]

[tasks.run-tui]
description = "Restart the daemon, then launch the terminal UI."
dependencies = ["restart-daemon"]
script = '''
describe="$(git describe --always --dirty --tags 2>/dev/null || git rev-parse --short HEAD)"
commit="$(git rev-parse --short HEAD)"
branch="$(git rev-parse --abbrev-ref HEAD)"
ldflags="-X patentmine/internal/version.Describe=$describe -X patentmine/internal/version.Commit=$commit -X patentmine/internal/version.Branch=$branch"
go run -ldflags "$ldflags" ${BINARY} tui
'''

[tasks.run-api]
description = "Restart the daemon, then start the web API server."
dependencies = ["restart-daemon"]
script = '''
describe="$(git describe --always --dirty --tags 2>/dev/null || git rev-parse --short HEAD)"
commit="$(git rev-parse --short HEAD)"
branch="$(git rev-parse --abbrev-ref HEAD)"
ldflags="-X patentmine/internal/version.Describe=$describe -X patentmine/internal/version.Commit=$commit -X patentmine/internal/version.Branch=$branch"
go run -ldflags "$ldflags" ${BINARY} api
'''

[tasks.migrate]
description = "Apply database migrations (wired up in Phase 2)."
script = '''
describe="$(git describe --always --dirty --tags 2>/dev/null || git rev-parse --short HEAD)"
commit="$(git rev-parse --short HEAD)"
branch="$(git rev-parse --abbrev-ref HEAD)"
ldflags="-X patentmine/internal/version.Describe=$describe -X patentmine/internal/version.Commit=$commit -X patentmine/internal/version.Branch=$branch"
go run -ldflags "$ldflags" ${BINARY} migrate
'''

[tasks.ci]
description = "Full check: formatting, vet, lint, tests."
dependencies = ["fmt-check", "vet", "lint", "test"]

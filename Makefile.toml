# cargo-make task runner for the PatentMine Go project.
# Run tasks with: cargo make <task>

[config]
# Skip cargo-make's built-in Rust-oriented tasks; this is a Go project.
skip_core_tasks = true
default_to_workspace = false

[env]
BINARY = "./cmd/patentmine"
APP_NAME = "patentmine"
BIN_DIR = "./bin"
API_PID_NAME = "patentmine-api.pid"

[tasks.build]
description = "Compile all packages."
script = '''
describe="$(git describe --always --dirty --tags 2>/dev/null || git rev-parse --short HEAD)"
commit="$(git rev-parse --short HEAD)"
branch="$(git rev-parse --abbrev-ref HEAD)"
ldflags="-X patentmine/internal/version.Describe=$describe -X patentmine/internal/version.Commit=$commit -X patentmine/internal/version.Branch=$branch"
version="$describe branch=$branch commit=$commit"
echo "building patentmine $version"
go build -ldflags "$ldflags" ./...
echo "built patentmine $version"
'''

[tasks.build-binary]
description = "Build the patentmine CLI binary into ./bin."
script = '''
describe="$(git describe --always --dirty --tags 2>/dev/null || git rev-parse --short HEAD)"
commit="$(git rev-parse --short HEAD)"
branch="$(git rev-parse --abbrev-ref HEAD)"
ldflags="-X patentmine/internal/version.Describe=$describe -X patentmine/internal/version.Commit=$commit -X patentmine/internal/version.Branch=$branch"
version="$describe branch=$branch commit=$commit"
mkdir -p "${BIN_DIR}"
echo "building patentmine binary $version"
go build -ldflags "$ldflags" -o "${BIN_DIR}/${APP_NAME}" ${BINARY}
echo "built ${BIN_DIR}/${APP_NAME} ($version)"
'''

[tasks.fmt]
description = "Format all Go source."
command = "gofmt"
args = ["-w", "."]

[tasks.fmt-check]
description = "Fail if any Go source is unformatted."
script = '''
unformatted="$(gofmt -l .)"
if [ -n "$unformatted" ]; then
  echo "unformatted files:"
  echo "$unformatted"
  exit 1
fi
'''

[tasks.vet]
description = "Run go vet."
command = "go"
args = ["vet", "./..."]

[tasks.lint]
description = "Run golangci-lint."
command = "golangci-lint"
args = ["run"]

[tasks.test]
description = "Run all unit tests."
command = "go"
args = ["test", "./..."]

[tasks.run-daemon]
description = "Start the engine daemon in the foreground."
script = '''
describe="$(git describe --always --dirty --tags 2>/dev/null || git rev-parse --short HEAD)"
commit="$(git rev-parse --short HEAD)"
branch="$(git rev-parse --abbrev-ref HEAD)"
ldflags="-X patentmine/internal/version.Describe=$describe -X patentmine/internal/version.Commit=$commit -X patentmine/internal/version.Branch=$branch"
go run -ldflags "$ldflags" ${BINARY} serve
'''

[tasks.stop-daemon]
description = "Stop the engine daemon if it is running."
script = '''
describe="$(git describe --always --dirty --tags 2>/dev/null || git rev-parse --short HEAD)"
commit="$(git rev-parse --short HEAD)"
branch="$(git rev-parse --abbrev-ref HEAD)"
ldflags="-X patentmine/internal/version.Describe=$describe -X patentmine/internal/version.Commit=$commit -X patentmine/internal/version.Branch=$branch"
go run -ldflags "$ldflags" ${BINARY} stop
'''

[tasks.start-daemon]
description = "Start the engine daemon in the background."
script = '''
describe="$(git describe --always --dirty --tags 2>/dev/null || git rev-parse --short HEAD)"
commit="$(git rev-parse --short HEAD)"
branch="$(git rev-parse --abbrev-ref HEAD)"
ldflags="-X patentmine/internal/version.Describe=$describe -X patentmine/internal/version.Commit=$commit -X patentmine/internal/version.Branch=$branch"
version="$describe branch=$branch commit=$commit"
paths="$(go run -ldflags "$ldflags" ${BINARY} paths)"
socket="$(echo "$paths" | awk -F= '/^SOCKET=/{print $2}')"
logs_dir="$(echo "$paths" | awk -F= '/^LOGS=/{print $2}')"
date_tag="$(date +%F)"
stdout_log="$logs_dir/daemon-stdout-$date_tag.log"
echo "starting patentmine daemon $version"
nohup go run -ldflags "$ldflags" ${BINARY} serve >> "$stdout_log" 2>&1 &
for _ in $(seq 1 50); do
  if [ -S "$socket" ]; then
    echo "patentmine daemon started ($socket)"
    echo "version: $version"
    echo "stdout log: $stdout_log"
    echo "structured log: $logs_dir/log-$date_tag.jsonl"
    echo "activity log: $logs_dir/activity-$date_tag.jsonl"
    exit 0
  fi
  sleep 0.1
done
echo "patentmine daemon did not create socket: $socket"
echo "check stdout log: $stdout_log"
exit 1
'''

[tasks.restart-daemon]
description = "Restart the engine daemon in the background."
dependencies = ["stop-daemon", "start-daemon"]
script = '''
describe="$(git describe --always --dirty --tags 2>/dev/null || git rev-parse --short HEAD)"
commit="$(git rev-parse --short HEAD)"
branch="$(git rev-parse --abbrev-ref HEAD)"
echo "restarted patentmine daemon $describe branch=$branch commit=$commit"
'''

[tasks.clean-logs]
description = "Remove dated logs and runtime socket/pid files from the configured app home."
script = '''
describe="$(git describe --always --dirty --tags 2>/dev/null || git rev-parse --short HEAD)"
commit="$(git rev-parse --short HEAD)"
branch="$(git rev-parse --abbrev-ref HEAD)"
ldflags="-X patentmine/internal/version.Describe=$describe -X patentmine/internal/version.Commit=$commit -X patentmine/internal/version.Branch=$branch"
paths="$(go run -ldflags "$ldflags" ${BINARY} paths)"
logs_dir="$(echo "$paths" | awk -F= '/^LOGS=/{print $2}')"
socket="$(echo "$paths" | awk -F= '/^SOCKET=/{print $2}')"
pid="$(echo "$paths" | awk -F= '/^PID=/{print $2}')"
mkdir -p "$logs_dir"
rm -f "$logs_dir"/* "$socket" "$pid"
echo "cleaned logs/runtime artifacts under $logs_dir"
'''

[tasks.clean-binaries]
description = "Remove built CLI binaries from ./bin."
script = '''
rm -rf "${BIN_DIR}"
echo "removed ${BIN_DIR}"
'''

[tasks.clean-runtime]
description = "Stop the daemon, then clean logs and runtime artifacts."
dependencies = ["stop-daemon", "clean-logs"]

[tasks.backup-db]
description = "Create a timestamped backup copy of the configured database."
script = '''
describe="$(git describe --always --dirty --tags 2>/dev/null || git rev-parse --short HEAD)"
commit="$(git rev-parse --short HEAD)"
branch="$(git rev-parse --abbrev-ref HEAD)"
ldflags="-X patentmine/internal/version.Describe=$describe -X patentmine/internal/version.Commit=$commit -X patentmine/internal/version.Branch=$branch"
paths="$(go run -ldflags "$ldflags" ${BINARY} paths)"
db_path="$(echo "$paths" | awk -F= '/^DB=/{print $2}')"
home_dir="$(echo "$paths" | awk -F= '/^HOME=/{print $2}')"
backup_dir="$home_dir/backups"
timestamp="$(date +%F-%H%M%S)"
backup_path="$backup_dir/${APP_NAME}-$timestamp.db"
if [ ! -f "$db_path" ]; then
  echo "database not found: $db_path"
  exit 1
fi
mkdir -p "$backup_dir"
cp "$db_path" "$backup_path"
echo "database backup created: $backup_path"
'''

[tasks.run-tui]
description = "Restart the daemon, then launch the terminal UI."
dependencies = ["restart-daemon"]
script = '''
describe="$(git describe --always --dirty --tags 2>/dev/null || git rev-parse --short HEAD)"
commit="$(git rev-parse --short HEAD)"
branch="$(git rev-parse --abbrev-ref HEAD)"
ldflags="-X patentmine/internal/version.Describe=$describe -X patentmine/internal/version.Commit=$commit -X patentmine/internal/version.Branch=$branch"
go run -ldflags "$ldflags" ${BINARY} tui
'''

[tasks.run-api]
description = "Restart the daemon, then start the web API server."
dependencies = ["restart-daemon"]
script = '''
describe="$(git describe --always --dirty --tags 2>/dev/null || git rev-parse --short HEAD)"
commit="$(git rev-parse --short HEAD)"
branch="$(git rev-parse --abbrev-ref HEAD)"
ldflags="-X patentmine/internal/version.Describe=$describe -X patentmine/internal/version.Commit=$commit -X patentmine/internal/version.Branch=$branch"
go run -ldflags "$ldflags" ${BINARY} api
'''

[tasks.start-api]
description = "Start the web API server in the background."
dependencies = ["restart-daemon"]
script = '''
describe="$(git describe --always --dirty --tags 2>/dev/null || git rev-parse --short HEAD)"
commit="$(git rev-parse --short HEAD)"
branch="$(git rev-parse --abbrev-ref HEAD)"
ldflags="-X patentmine/internal/version.Describe=$describe -X patentmine/internal/version.Commit=$commit -X patentmine/internal/version.Branch=$branch"
paths="$(go run -ldflags "$ldflags" ${BINARY} paths)"
home_dir="$(echo "$paths" | awk -F= '/^HOME=/{print $2}')"
logs_dir="$(echo "$paths" | awk -F= '/^LOGS=/{print $2}')"
api_pid="$home_dir/${API_PID_NAME}"
api_addr="${PATENTMINE_API_ADDR:-127.0.0.1:8080}"
date_tag="$(date +%F)"
stdout_log="$logs_dir/api-stdout-$date_tag.log"

mkdir -p "$home_dir" "$logs_dir"
if [ -f "$api_pid" ] && kill -0 "$(cat "$api_pid")" >/dev/null 2>&1; then
  echo "patentmine API already running on http://$api_addr (pid $(cat "$api_pid"))"
  exit 0
fi
rm -f "$api_pid"

echo "starting patentmine API on http://$api_addr"
PATENTMINE_API_ADDR="$api_addr" nohup go run -ldflags "$ldflags" ${BINARY} api >> "$stdout_log" 2>&1 &
echo $! > "$api_pid"

for _ in $(seq 1 50); do
  if curl -fsS "http://$api_addr/healthz" >/dev/null 2>&1; then
    echo "patentmine API started ($api_addr)"
    echo "pid file: $api_pid"
    echo "stdout log: $stdout_log"
    exit 0
  fi
  sleep 0.2
done

echo "patentmine API did not become healthy at http://$api_addr"
echo "check stdout log: $stdout_log"
exit 1
'''

[tasks.stop-api]
description = "Stop the background web API server if it is running."
script = '''
describe="$(git describe --always --dirty --tags 2>/dev/null || git rev-parse --short HEAD)"
commit="$(git rev-parse --short HEAD)"
branch="$(git rev-parse --abbrev-ref HEAD)"
ldflags="-X patentmine/internal/version.Describe=$describe -X patentmine/internal/version.Commit=$commit -X patentmine/internal/version.Branch=$branch"
paths="$(go run -ldflags "$ldflags" ${BINARY} paths)"
home_dir="$(echo "$paths" | awk -F= '/^HOME=/{print $2}')"
api_pid="$home_dir/${API_PID_NAME}"

if [ ! -f "$api_pid" ]; then
  echo "patentmine API is not running"
  exit 0
fi
pid="$(cat "$api_pid")"
if kill -0 "$pid" >/dev/null 2>&1; then
  kill "$pid" >/dev/null 2>&1 || true
  for _ in $(seq 1 50); do
    if ! kill -0 "$pid" >/dev/null 2>&1; then
      rm -f "$api_pid"
      echo "patentmine API stopped"
      exit 0
    fi
    sleep 0.1
  done
  echo "patentmine API did not stop cleanly (pid $pid)"
  exit 1
fi
rm -f "$api_pid"
echo "patentmine API pid file was stale and has been removed"
'''

[tasks.restart-api]
description = "Restart the background web API server."
dependencies = ["stop-api", "start-api"]

[tasks.run-tui-api]
description = "Start daemon and web API in the background, then launch the TUI."
dependencies = ["restart-daemon", "start-api"]
script = '''
describe="$(git describe --always --dirty --tags 2>/dev/null || git rev-parse --short HEAD)"
commit="$(git rev-parse --short HEAD)"
branch="$(git rev-parse --abbrev-ref HEAD)"
ldflags="-X patentmine/internal/version.Describe=$describe -X patentmine/internal/version.Commit=$commit -X patentmine/internal/version.Branch=$branch"
go run -ldflags "$ldflags" ${BINARY} tui
'''

[tasks.smoke-api]
description = "Start the daemon, launch the web API on a test port, and verify core HTTP endpoints."
dependencies = ["restart-daemon"]
script = '''
describe="$(git describe --always --dirty --tags 2>/dev/null || git rev-parse --short HEAD)"
commit="$(git rev-parse --short HEAD)"
branch="$(git rev-parse --abbrev-ref HEAD)"
ldflags="-X patentmine/internal/version.Describe=$describe -X patentmine/internal/version.Commit=$commit -X patentmine/internal/version.Branch=$branch"
api_addr="${PATENTMINE_API_ADDR:-127.0.0.1:18080}"
api_log="/tmp/patentmine-api-smoke.log"

cleanup() {
  if [ -n "$api_pid" ]; then
    kill "$api_pid" >/dev/null 2>&1 || true
    wait "$api_pid" >/dev/null 2>&1 || true
  fi
}
trap cleanup EXIT

echo "starting temporary API server on http://$api_addr"
PATENTMINE_API_ADDR="$api_addr" go run -ldflags "$ldflags" ${BINARY} api > "$api_log" 2>&1 &
api_pid=$!

for _ in $(seq 1 50); do
  if curl -fsS "http://$api_addr/healthz" >/dev/null 2>&1; then
    break
  fi
  sleep 0.2
done

echo "verifying /healthz"
curl -fsS "http://$api_addr/healthz"
echo
echo "verifying /commands"
curl -fsS "http://$api_addr/commands" >/dev/null
echo "ok"
echo "verifying /assignees/stats"
curl -fsS "http://$api_addr/assignees/stats" >/dev/null
echo "ok"
echo "verifying /classifications/stats"
curl -fsS "http://$api_addr/classifications/stats" >/dev/null
echo "ok"
echo "API smoke test passed"
'''

[tasks.migrate]
description = "Apply database migrations (wired up in Phase 2)."
script = '''
describe="$(git describe --always --dirty --tags 2>/dev/null || git rev-parse --short HEAD)"
commit="$(git rev-parse --short HEAD)"
branch="$(git rev-parse --abbrev-ref HEAD)"
ldflags="-X patentmine/internal/version.Describe=$describe -X patentmine/internal/version.Commit=$commit -X patentmine/internal/version.Branch=$branch"
go run -ldflags "$ldflags" ${BINARY} migrate
'''

[tasks.ci]
description = "Full check: formatting, vet, lint, tests."
dependencies = ["fmt-check", "vet", "lint", "test"]

[tasks.ollama-setup]
description = "Install Ollama and pull the mistral LLM model."
script = '''
if ! command -v ollama >/dev/null 2>&1; then
  echo "Ollama is not installed. Installing Ollama..."
  curl -fsSL https://ollama.com/install.sh | sh
else
  echo "Ollama is already installed."
fi

echo "Starting Ollama service (if not already running)..."
if command -v systemctl >/dev/null 2>&1; then
  if systemctl is-active --quiet ollama; then
    echo "Ollama service is active."
  else
    echo "Starting Ollama via systemd..."
    sudo systemctl daemon-reload
    sudo systemctl enable ollama
    sudo systemctl start ollama
  fi
else
  echo "systemd not detected. Please ensure 'ollama serve' is running in the background."
fi

echo "Waiting for Ollama to be ready..."
for i in $(seq 1 10); do
  if curl -s http://localhost:11434 >/dev/null; then
    echo "Ollama is up and running!"
    break
  fi
  sleep 1
done

echo "Pulling the mistral LLM model..."
ollama pull mistral
echo "Ollama and mistral LLM are successfully configured!"
'''

[tasks.ollama-update]
description = "Update the mistral LLM model and Ollama."
script = '''
echo "Updating Ollama binary..."
curl -fsSL https://ollama.com/install.sh | sh
echo "Updating mistral LLM model..."
ollama pull mistral
echo "Update complete!"
'''

# cargo-make task runner for the PatentMine Go project.
# Run tasks with: cargo make <task>

[config]
# Skip cargo-make's built-in Rust-oriented tasks; this is a Go project.
skip_core_tasks = true
default_to_workspace = false

[env]
BINARY = "./cmd/patentmine"
APP_NAME = "patentmine"
BIN_DIR = "./bin"
API_PID_NAME = "patentmine-api.pid"
API_ADDR = "127.0.0.1:18080"
PATENTMINE_DOCS_EXPORT_DIR = "${CARGO_MAKE_WORKING_DIRECTORY}/exports"
PM_VERSION_SCRIPT = '''
PM_DESCRIBE="$(git describe --always --dirty --tags 2>/dev/null || git rev-parse --short HEAD)"
PM_COMMIT="$(git rev-parse --short HEAD)"
PM_BRANCH="$(git rev-parse --abbrev-ref HEAD)"
PM_LDFLAGS="-X patentmine/internal/version.Describe=$PM_DESCRIBE -X patentmine/internal/version.Commit=$PM_COMMIT -X patentmine/internal/version.Branch=$PM_BRANCH"
PM_VERSION="$PM_DESCRIBE branch=$PM_BRANCH commit=$PM_COMMIT"
'''

[tasks.build]
description = "Compile all packages."
script = '''
eval "$PM_VERSION_SCRIPT"
echo "building patentmine $PM_VERSION"
go build -ldflags "$PM_LDFLAGS" ./...
echo "built patentmine $PM_VERSION"
'''

[tasks.build-binary]
description = "Build the patentmine CLI binary into ./bin."
script = '''
eval "$PM_VERSION_SCRIPT"
mkdir -p "${BIN_DIR}"
echo "building patentmine binary $PM_VERSION"
go build -ldflags "$PM_LDFLAGS" -o "${BIN_DIR}/${APP_NAME}" ${BINARY}
echo "built ${BIN_DIR}/${APP_NAME} ($PM_VERSION)"
'''

[tasks.fmt]
description = "Format all Go source."
command = "gofmt"
args = ["-w", "."]

[tasks.fmt-check]
description = "Fail if any Go source is unformatted."
script = '''
unformatted="$(gofmt -l .)"
if [ -n "$unformatted" ]; then
  echo "unformatted files:"
  echo "$unformatted"
  exit 1
fi
'''

[tasks.vet]
description = "Run go vet."
command = "go"
args = ["vet", "./..."]

[tasks.lint]
description = "Run golangci-lint."
command = "golangci-lint"
args = ["run"]

[tasks.test]
description = "Run all unit tests."
command = "go"
args = ["test", "./..."]

[tasks.check]
description = "Check configured external service connectivity."
script = '''
eval "$PM_VERSION_SCRIPT"
go run -ldflags "$PM_LDFLAGS" ${BINARY} check-connectivity $CARGO_MAKE_TASK_ARGS
'''

[tasks.check-uspto]
description = "Check USPTO API key and connectivity."
script = '''
eval "$PM_VERSION_SCRIPT"
go run -ldflags "$PM_LDFLAGS" ${BINARY} check-connectivity uspto $CARGO_MAKE_TASK_ARGS
'''

[tasks.lookup]
description = "Look up a patent by USPTO application number."
script = '''
eval "$PM_VERSION_SCRIPT"
go run -ldflags "$PM_LDFLAGS" ${BINARY} lookup $CARGO_MAKE_TASK_ARGS
'''

[tasks.expiration-date]
description = "Compute and compare estimated patent expiration dates. See EXPIRATION_DATE.md for details."
script = '''
eval "$PM_VERSION_SCRIPT"
go run -ldflags "$PM_LDFLAGS" ${BINARY} expiration-date $CARGO_MAKE_TASK_ARGS
'''

[tasks.check-b2]
description = "Check Backblaze B2 access through rclone."
script = '''
eval "$PM_VERSION_SCRIPT"
go run -ldflags "$PM_LDFLAGS" ${BINARY} check-connectivity b2 $CARGO_MAKE_TASK_ARGS
'''

[tasks.check-b2-api]
description = "Check Backblaze B2 native API key and bucket access."
script = '''
eval "$PM_VERSION_SCRIPT"
go run -ldflags "$PM_LDFLAGS" ${BINARY} check-connectivity b2-api $CARGO_MAKE_TASK_ARGS
'''

[tasks.check-rclone-b2]
description = "Check Backblaze B2 access through rclone only."
script = '''
eval "$PM_VERSION_SCRIPT"
go run -ldflags "$PM_LDFLAGS" ${BINARY} check-connectivity rclone-b2 $CARGO_MAKE_TASK_ARGS
'''

[tasks.run-daemon]
description = "Start the engine daemon in the foreground."
script = '''
eval "$PM_VERSION_SCRIPT"
go run -ldflags "$PM_LDFLAGS" ${BINARY} serve
'''

[tasks.stop-daemon]
description = "Stop the engine daemon if it is running."
script = '''
eval "$PM_VERSION_SCRIPT"
go run -ldflags "$PM_LDFLAGS" ${BINARY} stop
'''

[tasks.start-daemon]
description = "Start the engine daemon in the background."
script = '''
eval "$PM_VERSION_SCRIPT"
paths="$(go run -ldflags "$PM_LDFLAGS" ${BINARY} paths)"
socket="$(echo "$paths" | awk -F= '/^SOCKET=/{print $2}')"
logs_dir="$(echo "$paths" | awk -F= '/^LOGS=/{print $2}')"
date_tag="$(date +%F)"
stdout_log="$logs_dir/daemon-stdout-$date_tag.log"
echo "starting patentmine daemon $PM_VERSION"
nohup go run -ldflags "$PM_LDFLAGS" ${BINARY} serve >> "$stdout_log" 2>&1 &
for _ in $(seq 1 50); do
  if [ -S "$socket" ]; then
    echo "patentmine daemon started ($socket)"
    echo "version: $PM_VERSION"
    echo "stdout log: $stdout_log"
    echo "structured log: $logs_dir/log-$date_tag.jsonl"
    echo "activity log: $logs_dir/activity-$date_tag.jsonl"
    exit 0
  fi
  sleep 0.1
done
echo "patentmine daemon did not create socket: $socket"
echo "check stdout log: $stdout_log"
exit 1
'''

[tasks.restart-daemon]
description = "Restart the engine daemon in the background."
dependencies = ["stop-daemon", "start-daemon"]
script = '''
eval "$PM_VERSION_SCRIPT"
echo "restarted patentmine daemon $PM_VERSION"
'''

[tasks.clean-logs]
description = "Remove dated logs and runtime socket/pid files from the configured app home."
script = '''
eval "$PM_VERSION_SCRIPT"
paths="$(go run -ldflags "$PM_LDFLAGS" ${BINARY} paths)"
logs_dir="$(echo "$paths" | awk -F= '/^LOGS=/{print $2}')"
socket="$(echo "$paths" | awk -F= '/^SOCKET=/{print $2}')"
pid="$(echo "$paths" | awk -F= '/^PID=/{print $2}')"
mkdir -p "$logs_dir"
rm -f "$logs_dir"/* "$socket" "$pid"
echo "cleaned logs/runtime artifacts under $logs_dir"
'''

[tasks.clean-binaries]
description = "Remove built CLI binaries from ./bin."
script = '''
rm -rf "${BIN_DIR}"
echo "removed ${BIN_DIR}"
'''

[tasks.clean-runtime]
description = "Stop the daemon, then clean logs and runtime artifacts."
dependencies = ["stop-daemon", "clean-logs"]

[tasks.backup-db]
description = "Create a timestamped backup copy of the configured database using native hot backups."
script = '''
eval "$PM_VERSION_SCRIPT"
go run -ldflags "$PM_LDFLAGS" ${BINARY} db backup
'''

[tasks.vacuum-db]
description = "Compact the active SQLite database to reclaim free space."
script = '''
eval "$PM_VERSION_SCRIPT"
go run -ldflags "$PM_LDFLAGS" ${BINARY} db vacuum
'''

[tasks.status-db]
description = "Check SQLite database file size, integrity, and row counts."
script = '''
eval "$PM_VERSION_SCRIPT"
go run -ldflags "$PM_LDFLAGS" ${BINARY} db status
'''

[tasks.database-validate]
description = "Scan database for duplicate stage patent collisions."
script = '''
eval "$PM_VERSION_SCRIPT"
go run -ldflags "$PM_LDFLAGS" ${BINARY} db validate $CARGO_MAKE_TASK_ARGS
'''

[tasks.list-logs]
description = "List all existing log and activity files."
script = '''
eval "$PM_VERSION_SCRIPT"
go run -ldflags "$PM_LDFLAGS" ${BINARY} logs list
'''

[tasks.archive-logs]
description = "Compress older log files into a backup archive."
script = '''
eval "$PM_VERSION_SCRIPT"
go run -ldflags "$PM_LDFLAGS" ${BINARY} logs archive
'''

[tasks.list-patents]
description = "List files in the patents (XML cache) directory."
script = '''
eval "$PM_VERSION_SCRIPT"
go run -ldflags "$PM_LDFLAGS" ${BINARY} uspto-manage list
'''

[tasks.archive-patents]
description = "Compress the patents/XML cache directory into a timestamped backup archive (in backups/)."
script = '''
eval "$PM_VERSION_SCRIPT"
go run -ldflags "$PM_LDFLAGS" ${BINARY} uspto-manage archive $CARGO_MAKE_TASK_ARGS
'''

[tasks.clean-patents]
description = "Remove all cached files from the patents (XML) directory."
script = '''
eval "$PM_VERSION_SCRIPT"
go run -ldflags "$PM_LDFLAGS" ${BINARY} uspto-manage clean
'''

# Direct shell variants (useful for CI or when avoiding repeated go run for simple ops)
[tasks.clean-patents-direct]
description = "Remove patents cache contents using path discovery + rm (no CLI)."
script = '''
eval "$PM_VERSION_SCRIPT"
paths="$(go run -ldflags "$PM_LDFLAGS" ${BINARY} paths)"
patents_dir="$(echo "$paths" | awk -F= '/^PATENTS=/{print $2}')"
if [ -n "$patents_dir" ] && [ -d "$patents_dir" ]; then
  rm -rf "$patents_dir"/*
  echo "cleaned patents cache: $patents_dir"
else
  echo "patents directory not found or empty: ${patents_dir:-<unset>}"
fi
'''

[tasks.run-tui]
description = "Restart the daemon, then launch the terminal UI."
dependencies = ["restart-daemon"]
script = '''
eval "$PM_VERSION_SCRIPT"
go run -ldflags "$PM_LDFLAGS" ${BINARY} tui
'''

[tasks.run-api]
description = "Restart the daemon, then start the web API server."
dependencies = ["stop-api", "restart-daemon"]
script = '''
eval "$PM_VERSION_SCRIPT"
api_addr="${PATENTMINE_API_ADDR:-${API_ADDR}}"
go run -ldflags "$PM_LDFLAGS" ${BINARY} api --addr "$api_addr"
'''

[tasks.start-api]
description = "Start the web API server in the background."
dependencies = ["stop-api", "restart-daemon"]
script = '''
eval "$PM_VERSION_SCRIPT"
paths="$(go run -ldflags "$PM_LDFLAGS" ${BINARY} paths)"
home_dir="$(echo "$paths" | awk -F= '/^HOME=/{print $2}')"
logs_dir="$(echo "$paths" | awk -F= '/^LOGS=/{print $2}')"
api_pid="$home_dir/${API_PID_NAME}"
api_addr="${PATENTMINE_API_ADDR:-${API_ADDR}}"
api_host="${api_addr%:*}"
api_port="${api_addr##*:}"
date_tag="$(date +%F)"
stdout_log="$logs_dir/api-stdout-$date_tag.log"

listener_pid() {
  set -- $(lsof -tiTCP@"$api_host":"$api_port" -sTCP:LISTEN 2>/dev/null || true)
  printf '%s\n' "${1:-}"
}

mkdir -p "$home_dir" "$logs_dir"
if [ -f "$api_pid" ] && kill -0 "$(cat "$api_pid")" >/dev/null 2>&1; then
  echo "patentmine API already running on http://$api_addr (pid $(cat "$api_pid"))"
  exit 0
fi
rm -f "$api_pid"

live_pid="$(listener_pid)"
if [ -n "$live_pid" ]; then
  live_cmd="$(ps -o command= -p "$live_pid" 2>/dev/null || true)"
  case "$live_cmd" in
    *patentmine*)
      echo "$live_pid" > "$api_pid"
      echo "patentmine API already running on http://$api_addr (pid $live_pid)"
      exit 0
      ;;
    *)
      echo "address $api_addr is already in use by pid $live_pid: $live_cmd"
      exit 1
      ;;
  esac
fi

echo "starting patentmine API on http://$api_addr"
nohup go run -ldflags "$PM_LDFLAGS" ${BINARY} api --addr "$api_addr" >> "$stdout_log" 2>&1 &
echo $! > "$api_pid"

for _ in $(seq 1 50); do
  if curl -fsS "http://$api_addr/healthz" >/dev/null 2>&1; then
    live_pid="$(listener_pid)"
    if [ -n "$live_pid" ]; then
      echo "$live_pid" > "$api_pid"
    fi
    echo "patentmine API started ($api_addr)"
    echo "pid file: $api_pid"
    echo "stdout log: $stdout_log"
    exit 0
  fi
  sleep 0.2
done

echo "patentmine API did not become healthy at http://$api_addr"
echo "check stdout log: $stdout_log"
rm -f "$api_pid"
exit 1
'''

[tasks.stop-api]
description = "Stop the background web API server if it is running."
script = '''
eval "$PM_VERSION_SCRIPT"
paths="$(go run -ldflags "$PM_LDFLAGS" ${BINARY} paths)"
home_dir="$(echo "$paths" | awk -F= '/^HOME=/{print $2}')"
api_pid="$home_dir/${API_PID_NAME}"
api_addr="${PATENTMINE_API_ADDR:-${API_ADDR}}"
api_host="${api_addr%:*}"
api_port="${api_addr##*:}"

listener_pid() {
  set -- $(lsof -tiTCP@"$api_host":"$api_port" -sTCP:LISTEN 2>/dev/null || true)
  printf '%s\n' "${1:-}"
}

if [ ! -f "$api_pid" ]; then
  pid_was_stale=0
else
  pid="$(cat "$api_pid")"
  if kill -0 "$pid" >/dev/null 2>&1; then
    cmd="$(ps -o command= -p "$pid" 2>/dev/null || true)"
    case "$cmd" in
      *patentmine*)
        kill "$pid" >/dev/null 2>&1 || true
        for _ in $(seq 1 50); do
          if ! kill -0 "$pid" >/dev/null 2>&1; then
            rm -f "$api_pid"
            echo "patentmine API stopped"
            exit 0
          fi
          sleep 0.1
        done
        echo "patentmine API did not stop cleanly (pid $pid)"
        exit 1
        ;;
    esac
  fi
  rm -f "$api_pid"
  pid_was_stale=1
fi

live_pid="$(listener_pid)"
if [ -n "$live_pid" ]; then
  live_cmd="$(ps -o command= -p "$live_pid" 2>/dev/null || true)"
  case "$live_cmd" in
    *patentmine*)
      kill "$live_pid" >/dev/null 2>&1 || true
      for _ in $(seq 1 50); do
        if [ -z "$(listener_pid)" ]; then
          rm -f "$api_pid"
          echo "patentmine API stopped"
          exit 0
        fi
        sleep 0.1
      done
      echo "patentmine API did not stop cleanly (pid $live_pid)"
      exit 1
      ;;
    *)
      echo "address $api_addr is in use by non-patentmine process (pid $live_pid): $live_cmd"
      exit 1
      ;;
  esac
fi

if [ "$pid_was_stale" -eq 1 ]; then
  echo "patentmine API pid file was stale and has been removed"
  exit 0
fi

echo "patentmine API is not running"
exit 0
'''

[tasks.restart-api]
description = "Restart the background web API server."
dependencies = ["start-api"]

[tasks.run-tui-api]
description = "Start daemon and web API in the background, then launch the TUI."
dependencies = ["start-api"]
script = '''
eval "$PM_VERSION_SCRIPT"
go run -ldflags "$PM_LDFLAGS" ${BINARY} tui
'''

[tasks.smoke-api]
description = "Start the daemon, launch the web API on a test port, and verify core HTTP endpoints."
dependencies = ["restart-daemon"]
script = '''
eval "$PM_VERSION_SCRIPT"
api_addr="${PATENTMINE_API_ADDR:-${API_ADDR}}"
api_log="/tmp/patentmine-api-smoke.log"

cleanup() {
  if [ -n "$api_pid" ]; then
    kill "$api_pid" >/dev/null 2>&1 || true
    wait "$api_pid" >/dev/null 2>&1 || true
  fi
}
trap cleanup EXIT

echo "starting temporary API server on http://$api_addr"
go run -ldflags "$PM_LDFLAGS" ${BINARY} api --addr "$api_addr" > "$api_log" 2>&1 &
api_pid=$!

for _ in $(seq 1 50); do
  if curl -fsS "http://$api_addr/healthz" >/dev/null 2>&1; then
    break
  fi
  sleep 0.2
done

echo "verifying /healthz"
curl -fsS "http://$api_addr/healthz"
echo
echo "verifying /commands"
curl -fsS "http://$api_addr/commands" >/dev/null
echo "ok"
echo "verifying /assignees/history"
curl -fsS "http://$api_addr/assignees/history" >/dev/null
echo "ok"
echo "verifying /classifications/stats"
curl -fsS "http://$api_addr/classifications/stats" >/dev/null
echo "ok"
echo "API smoke test passed"
'''

[tasks.migrate]
description = "Apply database migrations (wired up in Phase 2)."
script = '''
eval "$PM_VERSION_SCRIPT"
go run -ldflags "$PM_LDFLAGS" ${BINARY} migrate
'''

[tasks.ci]
description = "Full check: formatting, vet, lint, tests."
dependencies = ["fmt-check", "vet", "lint", "test"]

[tasks.ollama-setup]
description = "Install Ollama and pull the mistral LLM model."
script = '''
if ! command -v ollama >/dev/null 2>&1; then
  echo "Ollama is not installed. Installing Ollama..."
  curl -fsSL https://ollama.com/install.sh | sh
else
  echo "Ollama is already installed."
fi

echo "Starting Ollama service (if not already running)..."
if command -v systemctl >/dev/null 2>&1; then
  if systemctl is-active --quiet ollama; then
    echo "Ollama service is active."
  else
    echo "Starting Ollama via systemd..."
    sudo systemctl daemon-reload
    sudo systemctl enable ollama
    sudo systemctl start ollama
  fi
else
  echo "systemd not detected. Please ensure 'ollama serve' is running in the background."
fi

echo "Waiting for Ollama to be ready..."
for i in $(seq 1 10); do
  if curl -s http://localhost:11434 >/dev/null; then
    echo "Ollama is up and running!"
    break
  fi
  sleep 1
done

echo "Pulling the mistral LLM model..."
ollama pull mistral
echo "Ollama and mistral LLM are successfully configured!"
'''

[tasks.ollama-update]
description = "Update the mistral LLM model and Ollama."
script = '''
echo "Updating Ollama binary..."
curl -fsSL https://ollama.com/install.sh | sh
echo "Updating mistral LLM model..."
ollama pull mistral
echo "Update complete!"
'''

# ---------------------------------------------------------------------------
# Drafting subsystem: provisional / non-provisional applications and
# office-action responses, rendered to .docx. Drafting runs in the daemon and
# uses the configured AI provider (local Ollama by default — see ollama-setup —
# or cloud Gemini via GEMINI_API_KEY). Start the daemon first (start-daemon).
# ---------------------------------------------------------------------------
[tasks.draft]
description = "Drafting CLI: new | list | show | export | ai | oa-import | oa-list. e.g. cargo make draft new --project p-123 --kind provisional --title 'My Invention'"
script = '''
eval "$PM_VERSION_SCRIPT"
go run -ldflags "$PM_LDFLAGS" ${BINARY} draft $CARGO_MAKE_TASK_ARGS
'''

[tasks.draft-setup]
description = "Provision the local AI drafting path (installs Ollama and pulls the model)."
dependencies = ["ollama-setup"]

[tasks.draft-demo]
description = "End-to-end smoke: create a provisional draft in PROJECT_ID and render it to .docx."
script = '''
eval "$PM_VERSION_SCRIPT"
run() { go run -ldflags "$PM_LDFLAGS" ${BINARY} "$@"; }

if [ -z "${PROJECT_ID:-}" ]; then
  echo "Set PROJECT_ID=<existing project id> first (create a project in the TUI or web API),"
  echo "then run: PROJECT_ID=p-123 cargo make draft-demo"
  exit 0
fi

echo "Creating a provisional draft in $PROJECT_ID..."
run draft new --project "$PROJECT_ID" --kind provisional --title "Demo Invention"
echo
echo "Listing drafts:"
run draft list --project "$PROJECT_ID"
echo
echo "Tip: copy a draft id from above, then render it:"
echo "  cargo make draft export --id <draftID>"
'''

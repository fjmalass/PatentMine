[config]
default_to_workspace = false
skip_core_tasks = true

[env]
GOCACHE = "/tmp/go-build"
PATENTMINE_LOG_FILE = "logs/patentmine.log"
PATENTMINE_MAX_LOGS = "5"
PATENTMINE_MAX_LOG_BACKUPS = "5"

[tasks.default]
alias = "run"


[tasks.init]
private = true

[tasks.end]
private = true

[tasks.empty]
private = true

[tasks.launch]
alias = "run-uspto"

[tasks.run-uspto]
description = "Launch PatentMine using USPTO ODP as the import source."
category = "Application"
command = "go"
args = [
  "run",
  "-buildvcs=false",
  "./cmd/patentmine",
  "--import-source", "uspto",
  "--log-file",
  "${PATENTMINE_LOG_FILE}",
  "--max-logs",
  "${PATENTMINE_MAX_LOGS}",
]

[tasks.run-google]
description = "Launch PatentMine using Google Patents as the import source."
category = "Application"
command = "go"
args = [
  "run",
  "-buildvcs=false",
  "./cmd/patentmine",
  "--import-source", "google",
  "--log-file",
  "${PATENTMINE_LOG_FILE}",
  "--max-logs",
  "${PATENTMINE_MAX_LOGS}",
]

[tasks.run]
alias = "run-uspto"

[tasks.cli-help]
description = "Show PatentMine CLI flags."
category = "Application"
command = "go"
args = ["run", "-buildvcs=false", "./cmd/patentmine", "--help"]

[tasks.test]
description = "Run all Go tests."
category = "Development"
command = "go"
args = ["test", "./..."]

[tasks.build]
description = "Build the PatentMine binary at ./patentmine."
category = "Development"
command = "go"
args = ["build", "-buildvcs=false", "-o", "patentmine", "./cmd/patentmine"]

[tasks.tidy]
description = "Resolve and tidy Go module dependencies."
category = "Development"
command = "go"
args = ["mod", "tidy"]

[tasks.fmt]
description = "Format all Go files."
category = "Development"
command = "gofmt"
args = [
  "-w",
  "cmd/patentmine/main.go",
  "internal/logging/logging.go",
  "internal/logging/logging_test.go",
  "internal/domain/models.go",
  "internal/domain/models_test.go",
  "internal/storage/storage.go",
  "internal/storage/sqlite/repository.go",
  "internal/storage/sqlite/repository_test.go",
  "internal/config/config.go",
  "internal/importer/fixture.go",
  "internal/importer/fixture_test.go",
  "internal/importer/google.go",
  "internal/importer/google_test.go",
  "internal/importer/uspto.go",
  "internal/ai/stub.go",
  "internal/ai/stub_test.go",
  "internal/tui/commands.go",
  "internal/tui/commands_test.go",
  "internal/tui/constants.go",
  "internal/tui/catalog.go",
  "internal/tui/catalog_test.go",
  "internal/tui/text.go",
  "internal/tui/pagination.go",
  "internal/tui/model.go",
  "internal/tui/model_test.go",
]

[tasks.check]
description = "Format, test, and build."
category = "Development"
dependencies = ["fmt", "test", "build"]

[tasks.clean]
description = "Remove the built binary."
category = "Maintenance"
command = "rm"
args = ["-f", "patentmine"]

[tasks.reset-db]
description = "Remove the local SQLite database so the next launch reseeds the fixture."
category = "Maintenance"
command = "rm"
args = ["-rf", "db/"]

[tasks.logs]
description = "Print the local TUI log file."
category = "Maintenance"
command = "bash"
args = ["scripts/show-log.sh"]

[tasks.backup]
description = "Create a timestamped backup of the database and PDFs using the backup script."
category = "Maintenance"
command = "bash"
args = ["scripts/backup.sh"]

[tasks.backup-log]
description = "Create a dated backup of the current log and prune old log backups."
category = "Maintenance"
command = "bash"
args = ["scripts/backup-log.sh"]

[tasks.list-backups]
description = "List all existing backups."
category = "Maintenance"
command = "ls"
args = ["-lh", "backups/"]
